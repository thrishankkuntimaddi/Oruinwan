name: Deploy web app

# The Oruinwan product website on GitHub Pages: the web client's landing, docs and legal pages
# built with `vite --mode site`, with download links to the latest release. "Log in" and "Get
# started" send visitors to their own team's server, which hosts the web app itself.
# Live at https://thrishankkuntimaddi.github.io/Oruniwan/
# One-time setup (done 2026-10-12): Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['client/**', 'platform/**', 'yarn.lock', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one, never a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Build
        working-directory: client
        # Project pages live under /<repository>/.
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
        run: npx vite build --mode site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist-site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
