name: Deploy web app

# The Oruinwan app (mobile/) in the browser, on GitHub Pages: redeployed on every change to main.
# Live at https://thrishankkuntimaddi.github.io/Oruniwan/
# One-time setup (done 2026-10-12): Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one, never a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Build
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV }}
        run: |
          # Optional Firebase web config, the same as the Android and desktop builds.
          if [ -n "$MOBILE_ENV" ]; then printf '%s\n' "$MOBILE_ENV" > .env; fi
          npm run build
          rm -f .env
          # Android-only page (outdated System WebView); not part of the web app.
          rm -f dist/webview-update.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
