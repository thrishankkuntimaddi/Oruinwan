name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --workspaces=false
      - run: npm run lint
      - name: Lint ai/ and sdk/
        run: |
          ./node_modules/.bin/eslint ../ai
          ./node_modules/.bin/eslint ../sdk
      # Jest roots include ../ai and ../sdk, so this also runs their suites.
      - run: npm test

  client:
    name: Client (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint --workspace=client
      - run: npm test --workspace=client
      - run: npm run build --workspace=client
        env:
          VITE_API_URL: /api
          VITE_GOOGLE_CLIENT_ID: ci-placeholder
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: dist
          retention-days: 7

  e2e:
    name: E2E (Playwright, core flows)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_MONGO_URI: mongodb://127.0.0.1:27017/chttrix_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      # Root install covers the client and e2e workspaces and hoists most server deps;
      # the server's own lockfile install fills in the rest.
      - run: npm ci
      - run: npm ci --workspaces=false
        working-directory: server
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test --workspace=e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
