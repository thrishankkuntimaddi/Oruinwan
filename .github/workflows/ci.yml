name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --workspaces=false
      - run: npm run lint
      - name: Lint ai/ and sdk/
        run: |
          ./node_modules/.bin/eslint ../ai
          ./node_modules/.bin/eslint ../sdk
      # Jest roots include ../ai and ../sdk, so this also runs their suites.
      - run: npm test

  client:
    name: Client (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint --workspace=client
      - run: npm test --workspace=client
      - run: npm run build --workspace=client
        env:
          VITE_API_URL: /api
          VITE_GOOGLE_CLIENT_ID: ci-placeholder
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: dist
          retention-days: 7
