name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One Yarn install at the root covers the client, server and e2e workspaces (yarn.lock).
jobs:
  server:
    name: Server (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn workspace server lint
      - run: yarn lint:ai
      - run: yarn lint:sdk
      # Jest roots include ../ai and ../sdk, so this also runs their suites.
      - run: yarn workspace server test

  client:
    name: Client (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn workspace client lint
      - run: yarn workspace client test
      - run: yarn workspace client build
        env:
          VITE_API_URL: /api
          VITE_GOOGLE_CLIENT_ID: ci-placeholder
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: dist
          retention-days: 7

  e2e:
    name: E2E (Playwright, core flows)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oruinwan
          POSTGRES_PASSWORD: oruinwan-dev
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oruinwan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_MONGO_URI: mongodb://127.0.0.1:27017/chttrix_e2e
      # The E2E stack drops, recreates and migrates this database on every run.
      E2E_DATABASE_URL: postgres://oruinwan:oruinwan-dev@127.0.0.1:5432/oruinwan_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn playwright install --with-deps chromium
        working-directory: e2e
      - run: yarn workspace e2e test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
