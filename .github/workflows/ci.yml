name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One Yarn install at the root covers the client, server and e2e workspaces (yarn.lock).
jobs:
  server:
    name: Server (lint + test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn workspace server lint
      - run: yarn lint:ai
      - run: yarn lint:sdk
      # Jest roots include ../ai and ../sdk, so this also runs their suites.
      - run: yarn workspace server test

  client:
    name: Client (lint + test + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn workspace client lint
      - run: yarn workspace client test
      - run: yarn workspace client build
        env:
          VITE_API_URL: /api
          VITE_GOOGLE_CLIENT_ID: ci-placeholder
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: dist
          retention-days: 7

  e2e:
    # Two halves side by side (each with its own databases): the flows, and the long smoke crawl
    # of every page. One after the other they took ~45 minutes, the whole time limit.
    name: E2E (Playwright, ${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [core flows, smoke crawl]
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oruinwan
          POSTGRES_PASSWORD: oruinwan-dev
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oruinwan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_MONGO_URI: mongodb://127.0.0.1:27017/oruinwan_e2e
      # The E2E stack drops, recreates and migrates this database on every run.
      E2E_DATABASE_URL: postgres://oruinwan:oruinwan-dev@127.0.0.1:5432/oruinwan_e2e
    steps:
      # The runner's disk filled up (ENOSPC) during the long smoke crawl: drop preinstalled
      # toolchains this job never uses (~20 GB) before anything else.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      # The phone app's interface runs in the browser for the phone flows (21-phone-member-dms).
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: mobile
      # --with-deps also apt-installs fonts from Ubuntu's mirrors, which sometimes cannot be
      # reached from the runner (2026-11-11: "Temporary failure resolving azure.archive.ubuntu.com"
      # four runs in a row). One attempt, capped at 4 minutes; if apt is down, install only the
      # browser (it comes from Playwright's own CDN, not apt): GitHub's Ubuntu image already ships
      # Chrome's system libraries, so the tests run without the extra fonts (verified 2026-11-11).
      - name: Install Chromium
        working-directory: e2e
        run: |
          if timeout 240 yarn playwright install --with-deps chromium; then exit 0; fi
          echo "::warning::apt mirror unreachable: installing Chromium without extra system packages"
          yarn playwright install chromium
      - name: Run the tests
        run: |
          if [ "${{ matrix.part }}" = "smoke crawl" ]; then
            yarn workspace e2e test tests/99-smoke-crawl.spec.js
          else
            yarn workspace e2e test --grep-invert "smoke crawl"
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
