name: Feature request
description: Suggest something Oruinwan should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to get done, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Mockups welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat
        - Huddles and meetings
        - Tasks and planning
        - Notes and knowledge
        - AI and agents
        - Integrations
        - Admin and security
        - Phone app
        - Desktop app
        - Self-hosting
        - Other
