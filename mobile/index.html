<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0c0c0c" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <title>Oruinwan</title>
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      (function () {
        try {
          var pref = localStorage.getItem('oru.theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').content = dark ? '#0c0c0c' : '#f5f4f2';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
