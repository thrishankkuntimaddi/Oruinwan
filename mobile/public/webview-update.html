<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Update Android System WebView</title>
    <!-- Shown by Capacitor when the phone's WebView is older than android.minWebViewVersion.
         Plain HTML and CSS only, so it renders on very old WebViews. -->
    <style>
      html { background: #0c0c0c; }
      body { margin: 0; background: #0c0c0c; color: #e4e4e4; font-family: Roboto, Arial, sans-serif; }
      .wrap { padding: 72px 28px 40px; max-width: 460px; margin: 0 auto; text-align: center; }
      img { width: 88px; height: 88px; border-radius: 20px; }
      h1 { font-size: 24px; margin: 28px 0 10px; }
      p { color: #8c8c8c; line-height: 1.5; font-size: 15px; }
      a.btn { display: block; margin-top: 28px; padding: 15px; border-radius: 12px; background: #b8956a; color: #120e08; font-weight: bold; text-decoration: none; font-size: 16px; }
      a.alt { display: block; margin-top: 14px; color: #c9a87c; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="icon-192.png" alt="Oruinwan" />
      <h1>One quick update needed</h1>
      <p>Oruinwan uses your phone's built-in web engine, <b>Android System WebView</b>, and the version on this phone is too old to run it.</p>
      <p>Update Android System WebView (or Google Chrome) from the Play Store, then open Oruinwan again.</p>
      <a class="btn" href="https://play.google.com/store/apps/details?id=com.google.android.webview">Update in Play Store</a>
      <a class="alt" href="https://play.google.com/store/apps/details?id=com.android.chrome">Or update Google Chrome</a>
    </div>
  </body>
</html>
