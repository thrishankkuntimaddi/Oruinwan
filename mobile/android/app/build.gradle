apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// One version for everything: mobile/package.json. versionCode = major*10000 + minor*100 + patch
// (mirrored in src/lib/version.js), so every release installs over the previous one.
def appVersion = new JsonSlurper().parse(file('../../package.json')).version
def versionParts = appVersion.tokenize('.').collect { it.replaceAll(/[^0-9].*$/, '') as int }
def appVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

// Release signing comes from environment variables (CI) or android/keystore.properties (local).
// Neither is committed. Without them the release APK is left unsigned rather than signed with a
// throwaway debug key, because a different key would stop updates installing over this app.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String env, String prop -> System.getenv(env) ?: keystoreProps.getProperty(prop) }
def releaseStorePath = signingValue('ANDROID_KEYSTORE_PATH', 'storeFile')

android {
    namespace = "com.oruinwan.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.oruinwan.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseStorePath) {
                storeFile file(releaseStorePath)
                storeType releaseStorePath.endsWith('.p12') ? 'pkcs12' : 'jks'
                storePassword signingValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias signingValue('ANDROID_KEY_ALIAS', 'keyAlias')
                keyPassword signingValue('ANDROID_KEY_PASSWORD', 'keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (releaseStorePath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
