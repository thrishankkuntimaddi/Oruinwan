<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Mirrors the CSP injected by electron/main.js for file:// pages -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
  <title>Chttrix — Offline</title>
  <style>
    :root {
      --bg: #0c0c0c;
      --surface: #161616;
      --border: #262626;
      --text: #e8e4de;
      --muted: #8a857d;
      --accent: #b8956a;
      --accent-hover: #c9a67b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      -webkit-user-select: none;
      user-select: none;
      /* Draggable area for the hidden-inset macOS title bar */
      -webkit-app-region: drag;
    }
    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px 32px;
      -webkit-app-region: no-drag;
    }
    .logo {
      width: 56px; height: 56px;
      margin: 0 auto 24px;
      border-radius: 14px;
      background: var(--accent);
      color: var(--bg);
      font-weight: 800;
      font-size: 30px;
      line-height: 56px;
    }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
    button {
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 600;
      background: var(--accent);
      color: var(--bg);
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    button:disabled { opacity: 0.6; cursor: default; }
    .status { margin-top: 16px; font-size: 12px; color: var(--muted); min-height: 1em; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="logo" aria-hidden="true">C</div>
    <h1>Chttrix can't reach the server</h1>
    <p>Check your internet connection. We'll keep trying to reconnect automatically.</p>
    <button id="retry" type="button">Retry</button>
    <div class="status" id="status" aria-live="polite"></div>
  </main>
  <script src="offline.js"></script>
</body>
</html>
