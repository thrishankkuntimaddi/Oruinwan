# Oruinwan infrastructure. Runs unchanged on a Mac (Colima/Docker Desktop), a Linux PC
# reached over Tailscale, or a VPS. During development the application (server/, ai/) runs
# outside this file and reaches these ports through server/.env.
#
#   docker compose up -d                 postgres + redis + s3 object storage (MongoDB stays on Atlas)
#   docker compose --profile mongo up -d also a local MongoDB
#   docker compose --profile mongo --profile app up -d --build
#                                        everything, including Oruinwan itself on :8080
#   docker compose down                  stop; data stays in the named volumes
#
# The app service reads its secrets from server/.env and is pointed at the services below.
# Set APP_URL to the public https:// address it is served on (sign-in cookies need HTTPS
# anywhere but localhost), and APP_MONGO_URI to use MongoDB Atlas instead of the mongo service.
# The bucket (S3_BUCKET) is created by the server on first boot.
# Change the passwords before exposing anything beyond localhost.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: oruinwan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oruinwan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oruinwan-dev}
      POSTGRES_DB: ${POSTGRES_DB:-oruinwan}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oruinwan} -d ${POSTGRES_DB:-oruinwan}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: oruinwan-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (RustFS: MinIO-compatible API and console; MinIO's own
  # images are no longer freely pullable). Any S3 service works later: only S3_* change.
  s3:
    image: rustfs/rustfs:latest
    container_name: oruinwan-s3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-oruinwan}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-oruinwan-dev-secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"          # S3 API
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"  # web console
    volumes:
      - s3data:/data

  mongo:
    image: mongo:7
    container_name: oruinwan-mongo
    restart: unless-stopped
    profiles: ["mongo"]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db

  app:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
        VITE_API_URL: ${VITE_API_URL:-}
    image: oruinwan:local
    container_name: oruinwan-app
    restart: unless-stopped
    profiles: ["app"]
    env_file:
      - path: server/.env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-oruinwan}:${POSTGRES_PASSWORD:-oruinwan-dev}@postgres:5432/${POSTGRES_DB:-oruinwan}
      MONGO_URI: ${APP_MONGO_URI:-mongodb://mongo:27017/oruinwan}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-oruinwan}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-oruinwan-dev-secret}
      # FRONTEND_URL / BACKEND_URL when the web app and API have separate addresses; else APP_URL.
      FRONTEND_URL: ${FRONTEND_URL:-${APP_URL:-http://localhost:8080}}
      BACKEND_URL: ${BACKEND_URL:-${APP_URL:-http://localhost:8080}}
      # Set here, not only in the image: env_file values would otherwise override the image's NODE_ENV.
      NODE_ENV: production
      PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_started

  # TURN relay for calls (coturn). People on mobile data or behind strict firewalls can't reach
  # each other directly; their call media goes through this relay instead. Optional:
  #   docker compose --profile turn up -d turn
  # Needs in .env (next to this file): TURN_SECRET (also in server/.env with TURN_URLS) and
  # TURN_EXTERNAL_IP=<public ip>/<private ip> on a cloud machine behind NAT (AWS EC2).
  # Open in the firewall: 3478 UDP+TCP and UDP ${TURN_MIN_PORT}-${TURN_MAX_PORT}.
  # scripts/setup-turn.sh does all of this on the server.
  turn:
    image: coturn/coturn:4.6.3
    container_name: oruinwan-turn
    restart: unless-stopped
    profiles: ["turn"]
    # Host networking: a relay needs a range of UDP ports, which Docker's port mapping handles badly.
    network_mode: host
    command:
      - -n
      - --log-file
      - stdout
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-}
      - --realm=${TURN_REALM:-oruinwan}
      - --external-ip=${TURN_EXTERNAL_IP:-}
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49200}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --stale-nonce=600
      - --user-quota=12
      - --total-quota=60
      # Never relay into the server's own network (the databases, the cloud metadata service).
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

volumes:
  pgdata:
  redisdata:
  s3data:
  mongodata:
