# Cache Microservice Configuration
# Redis cache service
#
# Usage: docker-compose -f docker-compose.cache.yml up
# Or included in main docker-compose.yml

version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: oruniwan-redis
    hostname: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - oruniwan-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}

volumes:
  redis_data:
    driver: local

networks:
  oruniwan-network:
    driver: bridge
