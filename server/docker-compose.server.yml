# Server Microservice Configuration
# Node.js Express API Server
#
# Usage: docker-compose -f docker-compose.server.yml up
# Or included in main docker-compose.yml

version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oruniwan-server
    hostname: server
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8080

      # PostgreSQL Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-oruniwan}

      # MongoDB Configuration
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-password}@mongo:27017/${MONGO_DB:-oruniwan}?authSource=admin

      # Redis Configuration
      REDIS_URL: redis://redis:6379

      # Third-party Services (configure via environment)
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      RABBITMQ_URL: ${RABBITMQ_URL}

    volumes:
      - .:/app/server
      - /app/server/node_modules

    networks:
      - oruniwan-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

networks:
  oruniwan-network:
    driver: bridge
